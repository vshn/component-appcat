apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: appcat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: garage-operator
    app.kubernetes.io/version: 0.6.29
    control-plane: controller-manager
    helm.sh/chart: garage-operator-0.6.29
  name: appcat-garage-operator-webhook
  namespace: syn-garage-operator
spec:
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: webhook
  selector:
    app.kubernetes.io/instance: appcat
    app.kubernetes.io/name: garage-operator
    control-plane: controller-manager
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: syn-garage-operator/appcat-garage-operator-webhook-cert
  labels:
    app.kubernetes.io/instance: appcat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: garage-operator
    app.kubernetes.io/version: 0.6.29
    control-plane: controller-manager
    helm.sh/chart: garage-operator-0.6.29
  name: appcat-garage-operator-mutating
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: appcat-garage-operator-webhook
        namespace: syn-garage-operator
        path: /mutate-garage-rajsingh-info-v1beta1-garagebucket
    failurePolicy: Fail
    name: mgaragebucket.kb.io
    rules:
      - apiGroups:
          - garage.rajsingh.info
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - garagebuckets
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: appcat-garage-operator-webhook
        namespace: syn-garage-operator
        path: /mutate-garage-rajsingh-info-v1beta2-garagecluster
    failurePolicy: Fail
    name: mgaragecluster.kb.io
    rules:
      - apiGroups:
          - garage.rajsingh.info
        apiVersions:
          - v1beta2
        operations:
          - CREATE
          - UPDATE
        resources:
          - garageclusters
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: appcat-garage-operator-webhook
        namespace: syn-garage-operator
        path: /mutate-garage-rajsingh-info-v1beta1-garagecluster
    failurePolicy: Fail
    name: mgarageclusterv1beta1.kb.io
    rules:
      - apiGroups:
          - garage.rajsingh.info
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - garageclusters
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: appcat-garage-operator-webhook
        namespace: syn-garage-operator
        path: /mutate-garage-rajsingh-info-v1beta1-garagekey
    failurePolicy: Fail
