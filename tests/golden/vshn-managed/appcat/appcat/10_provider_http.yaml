apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '-80'
  labels:
    name: provider-http
  name: provider-http
spec:
  package: ghcr.io/crossplane-contrib/provider-http:v1.0.14
  packagePullPolicy: IfNotPresent
  runtimeConfigRef:
    name: provider-http
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '-90'
  name: provider-http
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              securityContext: {}
          securityContext: {}
          serviceAccountName: provider-http
---
apiVersion: http.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '-50'
  labels:
    name: http
  name: http
spec:
  credentials:
    source: InjectedIdentity
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-100'
  labels:
    name: provider-http
  name: provider-http
  namespace: syn-crossplane
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: provider-http
    name: provider-http-metrics
  name: provider-http-metrics
  namespace: syn-crossplane
spec:
  ports:
    - name: metrics
      port: 8080
  selector:
    pkg.crossplane.io/provider: provider-http
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: provider-http
    name: provider-http
  name: provider-http
  namespace: syn-crossplane
spec:
  endpoints:
    - path: /metrics
      port: metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-http
