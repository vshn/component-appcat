apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    syn: 'true'
    syn_component: appcat
    syn_team: schedar
  name: vshn-vshngarage-sla
  namespace: syn-appcat-slos
spec:
  groups:
    - name: appcat-vshngarage-sla-target
      rules:
        - alert: VSHNGarageSla
          annotations:
            runbook_url: https://kb.vshn.ch/app-catalog/framework/runbooks/GuaranteedUptimeTarget.html
            summary: '{{$labels.service}} {{$labels.name}} down in {{$labels.instance_namespace}}'
            title: '{{$labels.service}} {{$labels.name}} down in {{$labels.instance_namespace}}'
          expr: rate(appcat_probes_seconds_count{reason!="success", service="VSHNGarage",
            ha="false", maintenance="false"}[5m]) > 0.4
          labels:
            OnCall: '{{ if eq $labels.sla "guaranteed" }}true{{ else }}false{{ end
              }}'
            service: VSHNGarage
            severity: critical
            syn: 'true'
            syn_component: appcat
            syn_team: schedar
        - alert: VSHNGarageSlaHA
          annotations:
            runbook_url: https://kb.vshn.ch/app-catalog/framework/runbooks/GuaranteedUptimeTarget.html
            summary: '{{$labels.service}} {{$labels.name}} down in {{$labels.instance_namespace}}'
            title: '{{$labels.service}} {{$labels.name}} down in {{$labels.instance_namespace}}'
          expr: rate(appcat_probes_seconds_count{reason!="success", service="VSHNGarage",
            ha="true"}[5m]) > 0.4
          labels:
            OnCall: '{{ if eq $labels.sla "guaranteed" }}true{{ else }}false{{ end
              }}'
            service: VSHNGarage
            severity: critical
            syn: 'true'
            syn_component: appcat
            syn_team: schedar
        - expr: vector(99.25)
          labels:
            service: VSHNGarage
          record: sla:objective:ratio
