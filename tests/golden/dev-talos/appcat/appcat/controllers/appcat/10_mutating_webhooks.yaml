apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: syn-appcat/webhook-certificate
  name: appcat-tcpgateway
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: syn-appcat
        path: /mutate-gateway-networking-k8s-io-v1-listenerset
    failurePolicy: Fail
    name: mlistenerset.kb.io
    objectSelector:
      matchLabels:
        appcat.vshn.io/tcpgateway: 'true'
    rules:
      - apiGroups:
          - gateway.networking.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - listenersets
    sideEffects: None
